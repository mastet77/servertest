<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tournament System</title>
</head>

<body>

    <h1>Submit Solution</h1>

    <h2>Teams</h2>
    <ul id="teams"></ul>

    <h2>Tasks</h2>
    <ul id="tasks"></ul>

    <h2>Create Submission</h2>

    <input id="teamId" placeholder="Team ID">
    <input id="taskId" placeholder="Task ID">
    <input id="githubLink" placeholder="GitHub link">
    <button onclick="sendSubmission()">Send</button>

    <h2>Result</h2>
    <pre id="result"></pre>

    <script>
        const API = "http://localhost:3000/api";

        fetch(API + "/teams")
            .then(res => res.json())
            .then(data => {
                const ul = document.getElementById("teams");
                data.forEach(t => {
                    const li = document.createElement("li");
                    li.textContent = `ID: ${t.id} | ${t.name}`;
                    ul.appendChild(li);
                });
            });

        fetch(API + "/tasks")
            .then(res => res.json())
            .then(data => {
                const ul = document.getElementById("tasks");
                data.forEach(t => {
                    const li = document.createElement("li");
                    li.textContent = `ID: ${t.id} | ${t.title}`;
                    ul.appendChild(li);
                });
            });

        function sendSubmission() {
            const teamId = document.getElementById("teamId").value;
            const taskId = document.getElementById("taskId").value;
            const githubLink = document.getElementById("githubLink").value;

            fetch(API + "/submissions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    teamId: Number(teamId),
                    taskId: Number(taskId),
                    githubLink
                })
            })
                .then(res => res.json())
                .then(data => {
                    document.getElementById("result").textContent =
                        JSON.stringify(data, null, 2);
                });
        }

        function loadSubmissions() {
            fetch(API + "/submissions")
                .then(res => res.json())
                .then(data => {
                    const ul = document.getElementById("submissions");
                    ul.innerHTML = "";

                    data.forEach(s => {
                        const li = document.createElement("li");

                        li.innerHTML = `
                            Team ${s.teamId} | Task ${s.taskId} | Score: ${s.score}
                            <button onclick="setScore(${s.id})">Set Score</button>`;

                        ul.appendChild(li);
                    });
                });
        }

        function loadLeaderboard() {
            Promise.all([
                fetch(API + "/submissions").then(res => res.json()),
                fetch(API + "/teams").then(res => res.json())
            ])
                .then(([subs, teams]) => {

                    const scores = {};

                    subs.forEach(s => {
                        if (!scores[s.teamId]) scores[s.teamId] = 0;
                        scores[s.teamId] += s.score || 0;
                    });

                    const leaderboard = Object.keys(scores).map(teamId => {
                        const team = teams.find(t => t.id == teamId);
                        return {
                            name: team ? team.name : "Unknown",
                            score: scores[teamId]
                        };
                    });

                    leaderboard.sort((a, b) => b.score - a.score);

                    const tbody = document.querySelector("#leaderboardTable tbody");
                    tbody.innerHTML = "";

                    leaderboard.forEach((t, index) => {
                        const tr = document.createElement("tr");

                        tr.innerHTML = `
            <td>${index + 1}</td>
            <td>${t.name}</td>
            <td>${t.score}</td>`;
                        tbody.appendChild(tr);
                    });
                });
        } // ← ВОТ ЭТОГО НЕ ХВАТАЛО
        function setScore(id) {
            const score = prompt("Enter score:");

            fetch(API + "/submissions/" + id, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    score: Number(score)
                })
            })
                .then(res => res.json())
                .then(data => {
                    alert("Score updated!");
                    loadSubmissions();
                    loadLeaderboard();
                });



        }

        loadLeaderboard();
        setInterval(loadLeaderboard, 3000);
    </script>

    <h2>Submissions</h2>
    <button onclick="loadSubmissions()">Load Submissions</button>
    <ul id="submissions"></ul>

    <h2>Leaderboard</h2>
    <button onclick="loadLeaderboard()">Load Leaderboard</button>

    <table border="1" id="leaderboardTable">
        <thead>
            <tr>
                <th>Place</th>
                <th>Team</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</body>

</html>
