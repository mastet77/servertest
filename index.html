<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tournament System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border-radius: 5px;
            border: none;
        }

        button {
            padding: 8px 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        ul {
            padding-left: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 8px;
            border-bottom: 1px solid #334155;
        }
    </style>
</head>

<body>

    <h1>Tournament System</h1>

    <!-- CREATE -->
    <div class="grid-3">

        <div class="card">
            <h2>Create Team</h2>
            <input id="teamName" placeholder="Team name">
            <button onclick="createTeam()">Create</button>
        </div>

        <div class="card">
            <h2>Create Task</h2>
            <input id="taskTitle" placeholder="Task title">
            <button onclick="createTask()">Create</button>
        </div>

        <div class="card">
            <h2>Create Submission</h2>
            <input id="teamId" placeholder="Team ID">
            <input id="taskId" placeholder="Task ID">
            <input id="githubLink" placeholder="GitHub link">
            <button onclick="sendSubmission()">Send</button>
        </div>

    </div>

    <!-- DATA -->
    <div class="container">

        <div class="card">
            <h2>Teams</h2>
            <ul id="teams"></ul>
        </div>

        <div class="card">
            <h2>Tasks</h2>
            <ul id="tasks"></ul>
        </div>

        <div class="card">
            <h2>Submissions</h2>
            <button onclick="loadSubmissions()">Load</button>
            <ul id="submissions"></ul>
        </div>

        <div class="card">
            <h2>Leaderboard</h2>
            <button onclick="loadLeaderboard()">Load</button>

            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Team</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody id="leaderboardTable"></tbody>
            </table>
        </div>

    </div>

    <script>
        const API = "http://localhost:3000/api";

        // ===== CREATE =====
        function createTeam() {
            const name = document.getElementById("teamName").value;

            fetch(API + "/teams", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name })
            }).then(() => {
                loadTeams();
            });
        }

        function createTask() {
            const title = document.getElementById("taskTitle").value;

            fetch(API + "/tasks", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title })
            }).then(() => {
                loadTasks();
            });
        }

        function sendSubmission() {
            const teamId = document.getElementById("teamId").value;
            const taskId = document.getElementById("taskId").value;
            const githubLink = document.getElementById("githubLink").value;

            fetch(API + "/submissions", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    teamId: Number(teamId),
                    taskId: Number(taskId),
                    githubLink
                })
            }).then(() => {
                loadSubmissions();
            });
        }

        // ===== LOAD =====
        function loadTeams() {
            fetch(API + "/teams")
                .then(res => res.json())
                .then(data => {
                    const ul = document.getElementById("teams");
                    ul.innerHTML = "";
                    data.forEach(t => {
                        ul.innerHTML += `<li>${t.id} | ${t.name}</li>`;
                    });
                });
        }

        function loadTasks() {
            fetch(API + "/tasks")
                .then(res => res.json())
                .then(data => {
                    const ul = document.getElementById("tasks");
                    ul.innerHTML = "";
                    data.forEach(t => {
                        ul.innerHTML += `<li>${t.id} | ${t.title}</li>`;
                    });
                });
        }

        function loadSubmissions() {
            fetch(API + "/submissions")
                .then(res => res.json())
                .then(data => {
                    const ul = document.getElementById("submissions");
                    ul.innerHTML = "";

                    data.forEach(s => {
                        ul.innerHTML += `
                        <li>
                            Team ${s.teamId} | Task ${s.taskId} | Score: ${s.score}
                            <button onclick="setScore(${s.id})">Set Score</button>
                        </li>`;
                    });
                });
        }

        function loadLeaderboard() {
            Promise.all([
                fetch(API + "/submissions").then(r => r.json()),
                fetch(API + "/teams").then(r => r.json())
            ]).then(([subs, teams]) => {

                const scores = {};

                subs.forEach(s => {
                    scores[s.teamId] = (scores[s.teamId] || 0) + (s.score || 0);
                });

                const leaderboard = Object.keys(scores).map(id => {
                    const team = teams.find(t => t.id == id);
                    return {
                        name: team ? team.name : "Unknown",
                        score: scores[id]
                    };
                });

                leaderboard.sort((a, b) => b.score - a.score);

                const tbody = document.getElementById("leaderboardTable");
                tbody.innerHTML = "";

                leaderboard.forEach((t, i) => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${i + 1}</td>
                            <td>${t.name}</td>
                            <td>${t.score}</td>
                        </tr>`;
                });
            });
        }

        function setScore(id) {
            const score = prompt("Enter score:");

            fetch(API + "/submissions/" + id, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ score: Number(score) })
            }).then(() => {
                loadSubmissions();
                loadLeaderboard();
            });
        }

        // ===== INIT =====
        loadTeams();
        loadTasks();
        loadSubmissions();
        loadLeaderboard();

        setInterval(loadLeaderboard, 3000);
    </script>

</body>

</html>
